# Configuración de Nginx para SESCO.
#
# Sirve el frontend compilado y reenvía las llamadas de la API al backend.
# El certificado lo aporta el operador (certbot o el de la institution).

upstream sesco_backend {
    server backend:5000;
    server 127.0.0.1:5000 backup;
}

server {
    listen 80;
    server_name _;

    # En producción, redirigir todo el tráfico a https.
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicación es de una sola página: cualquier ruta devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://sesco_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Los archivos compilados llevan hash en el nombre: se pueden cachear.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 100k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
