name: Integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asistencia_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Preparar la base de pruebas
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/asistencia_db
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/asistencia_db" -f ../infra/postgres/init.sql
          psql "postgresql://postgres:postgres@localhost:5432/asistencia_db" -c "CREATE DATABASE sesco_test;"
          psql "postgresql://postgres:postgres@localhost:5432/sesco_test" -f ../infra/postgres/init.sql

      - name: Configurar el entorno
        working-directory: backend
        env:
          SECRET_KEY: clave-de-prueba
          JWT_SECRET_KEY: clave-de-prueba-jwt
          TOTP_ENCRYPTION_KEY: clave-de-prueba-totp
        run: |
          cat > .env <<EOF
          FLASK_ENV=testing
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/asistencia_db
          TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/sesco_test
          SECRET_KEY=clave-de-prueba
          JWT_SECRET_KEY=clave-de-prueba-jwt
          TOTP_ENCRYPTION_KEY=clave-de-prueba-totp
          TZ=America/La_Paz
          EOF

      - name: Comprobar los modelos contra el esquema
        working-directory: backend
        run: python ../scripts/verificar_modelos.py

      - name: Comprobar las reglas de arquitectura
        working-directory: backend
        run: lint-imports

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Tests
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Comprobar los tipos y compilar
        working-directory: frontend
        run: npm run build
